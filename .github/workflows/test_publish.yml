name: Test & Publish

on:
  push:
    paths-ignore:
      - '**/README.md'
      - 'doc/*'
  pull_request:
    paths-ignore:
      - '**/README.md'
      - 'doc/*'
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python-version: "3.10"
            numpy-version: "1.26.4"
          - python-version: "3.10"
            numpy-version: "2.0.2"
          - python-version: "3.13"
            numpy-version: "2.2.5"
      fail-fast: false

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e . numpy==${{ matrix.numpy-version }}
        pip install mne flake8 pytest pymatreader
        mne sys_info -d
      shell: bash -el {0}

    - name: Lint
      run: |
        flake8 .

    - name: Test
      run: |
        pytest

  publish:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/stable')
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0  # hatch-vcs needs tags to determine the version

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.13"

    - name: Build Package
      run: |
        python -m pip install --upgrade pip build twine
        python -m build
      shell: bash -el {0}

    - name: Test dists
      run: |
        twine check --strict dist/*
        ls dist/*.tar.gz | wc -l | grep "^1$"
        pip install dist/*.whl
        python -c "import eeglabio; print(eeglabio.__version__)"
      shell: bash -el {0}

    - name: Check version matches release tag
      if: github.event_name == 'release'
      run: |
        ls dist/eeglabio-${GITHUB_REF_NAME#v}.tar.gz dist/eeglabio-${GITHUB_REF_NAME#v}-*.whl
      shell: bash -el {0}

    - name: Publish to Test PyPI
      if: github.event_name == 'push'
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/
        password: ${{ secrets.TEST_PYPI_API_TOKEN }}

    - name: Publish to PyPI
      if: github.event_name == 'release'
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
